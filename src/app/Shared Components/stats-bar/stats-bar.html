<div class="stats-bar" #statsBar>
  @for (stat of stats; track stat.label) {
    <div class="stat">
      <span class="num" #statNum [attr.data-target]="stat.target" [attr.data-suffix]="stat.suffix">
        {{ stat.target }}{{ stat.suffix }}
      </span>
      <span class="label">{{ stat.label }}</span>
    </div>
  }
</div>
