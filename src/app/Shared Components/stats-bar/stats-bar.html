<div class="stats-bar" #statsBar id="statusBar">
    <div class="stat">
        <span class="num" #statNum data-target="20" data-suffix="+">0</span>
        <span class="label">Years Combined Experience</span>
    </div>
    <div class="stat">
        <span class="num" #statNum data-target="20" data-suffix="+">0</span>
        <span class="label">Projects Completed</span>
    </div>
    <div class="stat">
        <span class="num" #statNum data-target="100" data-suffix="%">0</span>
        <span class="label">Satisfaction Guarantee</span>
    </div>
    <div class="stat">
        <span class="num" #statNum data-target="100" data-suffix="%">0</span>
        <span class="label">Licensed & Insured</span>
    </div>
</div>
